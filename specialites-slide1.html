<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Matsui Specialites Products</title>
<meta name="hz:slide-selector" content=".post" />
<meta name="hz:canvas-width" content="900" />
<meta name="hz:canvas-height" content="1200" />
<link rel="stylesheet" href="https://use.typekit.net/bxy7btv.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#A6EDE3; }
  body { display:flex; justify-content:center; align-items:center; }

  .post {
    position:relative;
    width:900px;
    height:1200px;
    overflow:hidden;
    background:
      radial-gradient(circle at 88% 6%, rgba(0,214,232,0.30) 0%, rgba(0,214,232,0) 46%),
      radial-gradient(circle at 6% 42%, rgba(255,31,140,0.10) 0%, rgba(255,31,140,0) 34%),
      radial-gradient(circle at 14% 4%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 38%),
      linear-gradient(158deg, #F0FFFC 0%, #CBF7F0 42%, #9CE9DD 100%);
    font-family:"poppins", sans-serif;
  }

  /* fine diagonal hairlines: a press/registration texture, kept very low contrast */
  .post::before {
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      -45deg, rgba(6,50,47,0.022) 0 1px, transparent 1px 14px);
  }

  .post::after {
    content:"";
    position:absolute;
    right:-160px; bottom:-190px;
    width:600px; height:600px;
    border-radius:50%;
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0) 58%),
                radial-gradient(circle, rgba(0,214,232,0.34) 0%, rgba(0,214,232,0) 68%);
  }

  .new-badge {
    position:absolute;
    top:46px; left:46px;
    background:linear-gradient(135deg, #FF1F8C 0%, #FF5FB0 100%);
    color:#fff;
    font-weight:700;
    font-size:19px;
    letter-spacing:3px;
    padding:9px 22px;
    border-radius:6px;
    transform:rotate(-6deg);
    box-shadow:0 10px 24px rgba(255,31,140,0.42);
    z-index:5;
  }

  .header { position:relative; z-index:2; padding-top:64px; text-align:center; }

  .brandrow { display:flex; align-items:center; justify-content:center; gap:10px; }
  .brandrow img { height:46px; width:auto; display:block; }
  .brandtext { text-align:left; line-height:1; }
  .brandtext .b1 { font-family:"poppins",sans-serif; font-weight:700; font-size:30px;
                    letter-spacing:1px; color:#06322F; }
  .brandtext .b2 { font-family:"poppins",sans-serif; font-weight:600; font-size:13px;
                    letter-spacing:6px; color:#1F7A73; margin-top:4px; }

  .titlewrap { position:relative; margin-top:22px; display:flex;
                align-items:baseline; justify-content:center; gap:14px; }

  .title {
    font-family:"anton",sans-serif;
    font-weight:400;
    color:#06322F;
    letter-spacing:-0.5px;
  }

  .script {
    font-family:"pacifico",sans-serif;
    font-weight:400;
    color:#FF1F8C;
    transform: rotate(-6deg) translateY(6px);
  }

  .card {
    position:relative;
    background:rgba(255,255,255,0.96);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:16px;
    box-shadow:0 1px 2px rgba(6,50,47,0.05),
               0 10px 24px -6px rgba(6,50,47,0.16);
    overflow:hidden;
  }

  /* thin color key across the top edge of each card */
  .card::before {
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:linear-gradient(90deg, var(--c1), var(--c2));
  }

  .badge-wrap {
    border-radius:50%;
    background:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }

  .badge { width:100%; height:100%; object-fit:cover; }

  .pname { font-family:"poppins",sans-serif; font-weight:700; letter-spacing:-0.2px; }
  .pcat  { font-family:"poppins",sans-serif; font-weight:600; color:#1F7A73;
            letter-spacing:1.6px; text-transform:uppercase; }
  .ppill { font-family:"poppins",sans-serif; font-weight:700; letter-spacing:0.8px;
            border-radius:5px; text-align:center; text-transform:uppercase; }

  .footer { position:relative; z-index:2; text-align:center; }
  .footer .line { width:56px; height:3px; background:#FF1F8C;
                   border-radius:2px; margin:0 auto 16px; }
  .footer .tag { font-family:"poppins",sans-serif; font-weight:700; font-size:13px;
                  letter-spacing:4.5px; color:#1F7A73; }

  .swatches { margin-top:24px; display:flex; justify-content:center; gap:0; }
  .swatches span { width:44px; height:8px; display:inline-block; }
  .swatches span:first-child { border-radius:4px 0 0 4px; }
  .swatches span:last-child  { border-radius:0 4px 4px 0; }

  .title { font-size:76px; }
  .script { font-size:44px; }

  .grid {
    position:relative; z-index:2;
    margin:70px auto 0;
    width:820px;
    display:grid;
    grid-template-columns: repeat(3, 260px);
    grid-auto-rows: 300px;
    gap:30px 20px;
    justify-content:center;
  }

  .card { display:flex; flex-direction:column; align-items:center;
          padding-top:28px; padding-bottom:22px; }
  .badge-wrap { width:130px; height:130px; }
  .pname { margin-top:18px; font-size:19px; }
  .pcat  { margin-top:5px;  font-size:11px; }
  .ppill { margin-top:15px; font-size:10px; padding:7px 13px; }
  .footer { margin-top:92px; }
</style>
</head>
